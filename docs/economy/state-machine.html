<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Sofia+Sans:wght@400;600;700&display=block" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#F2ECE0;font-family:'Sofia Sans',sans-serif;color:#241F1B}svg text{font-family:'Sofia Sans',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect x="0" y="0" width="1500" height="900" fill="#F2ECE0" stroke="none" stroke-width="1" /><text x="40" y="52" font-size="30" font-weight="700" fill="#241F1B" text-anchor="start" style="font-family:'Young Serif',serif;font-weight:400">One case: the state machine</text><text x="40" y="78" font-size="15" font-weight="400" fill="#675F55" text-anchor="start" >C = the years still possible. The target is always in C. Anything refused costs nothing and changes nothing.</text><rect x="40" y="120" width="260" height="70" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="170.0" y="144" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Case opens</text><text x="170.0" y="164" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >Free dossier read. C0 shown.</text><line x1="300" y1="155" x2="380" y2="155" stroke="#241F1B" stroke-width="2" /><polygon points="380.0,155.0 371.7,158.5 371.7,151.5" fill="#241F1B"/><rect x="380" y="100" width="300" height="110" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="530.0" y="124" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Reasoning (free)</text><text x="530.0" y="144" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >Move the marker, read sources,</text><text x="530.0" y="161" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >rule years in or out in your head.</text><text x="530.0" y="178" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >Nothing here is charged.</text><line x1="530" y1="210" x2="530" y2="270" stroke="#241F1B" stroke-width="2" /><polygon points="530.0,270.0 526.5,261.7 533.5,261.7" fill="#241F1B"/><text x="536.0" y="234.0" font-size="13" font-weight="600" fill="#241F1B" text-anchor="start" >reveal</text><rect x="380" y="270" width="300" height="130" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="530.0" y="294" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Evidence: reveal clue j</text><text x="530.0" y="314" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >needs the listed price available</text><text x="530.0" y="331" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >if it removes nothing: free</text><text x="530.0" y="348" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >else C := C ∩ clue, pay price</text><text x="530.0" y="365" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >then back to reasoning</text><line x1="680" y1="155" x2="790" y2="155" stroke="#241F1B" stroke-width="2" /><polygon points="790.0,155.0 781.7,158.5 781.7,151.5" fill="#241F1B"/><text x="741.0" y="149.0" font-size="13" font-weight="600" fill="#241F1B" text-anchor="start" >Trace</text><rect x="790" y="100" width="330" height="120" fill="#FBF7EF" stroke="#A9A194" stroke-width="1.6" /><text x="955.0" y="124" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Trace year y (only if kept)</text><text x="955.0" y="144" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >refused free if it cannot inform</text><text x="955.0" y="161" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >earlier: C := years < y</text><text x="955.0" y="178" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >later: C := years > y   same: C := {y}</text><text x="955.0" y="195" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >then back to reasoning</text><line x1="380" y1="190" x2="340" y2="190" stroke="#241F1B" stroke-width="2" /><line x1="340" y1="190" x2="340" y2="510" stroke="#241F1B" stroke-width="2" /><line x1="340" y1="510" x2="380" y2="510" stroke="#241F1B" stroke-width="2" /><polygon points="380.0,510.0 371.7,513.5 371.7,506.5" fill="#241F1B"/><text x="332" y="345" font-size="13" font-weight="600" fill="#241F1B" text-anchor="end" >lock (any time)</text><rect x="380" y="470" width="300" height="80" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="530.0" y="494" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Lock year y</text><text x="530.0" y="514" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >y must still be possible</text><line x1="530" y1="550" x2="530" y2="600" stroke="#241F1B" stroke-width="2" /><polygon points="530.0,600.0 526.5,591.7 533.5,591.7" fill="#241F1B"/><polygon points="530,600 640,650 530,700 420,650" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6"/><text x="530" y="656" font-size="15" font-weight="700" fill="#241F1B" text-anchor="middle" >y = target?</text><line x1="640" y1="650" x2="780" y2="650" stroke="#526A57" stroke-width="2" /><polygon points="780.0,650.0 771.7,653.5 771.7,646.5" fill="#526A57"/><text x="716.0" y="644.0" font-size="13" font-weight="600" fill="#526A57" text-anchor="start" >yes</text><rect x="780" y="610" width="300" height="80" fill="#526A57" stroke="#526A57" stroke-width="1.6" /><text x="930.0" y="634" font-size="15.5" font-weight="700" fill="#F2ECE0" text-anchor="middle" >Solved</text><text x="930.0" y="654" font-size="13" font-weight="400" fill="#F2ECE0" text-anchor="middle" >clean if first Lock and no spend</text><line x1="420" y1="650" x2="300" y2="650" stroke="#B4412D" stroke-width="2" /><polygon points="300.0,650.0 308.3,646.5 308.3,653.5" fill="#B4412D"/><text x="366.0" y="644.0" font-size="13" font-weight="600" fill="#B4412D" text-anchor="start" >no</text><rect x="40" y="570" width="260" height="160" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="170.0" y="594" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Wrong Lock</text><text x="170.0" y="614" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >A: one Lock. Case is MISSED.</text><text x="170.0" y="631" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >Answer and proof are revealed.</text><text x="170.0" y="648" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >B: year y is removed, no direction.</text><text x="170.0" y="665" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >Lock left: back to reasoning.</text><text x="170.0" y="682" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >None left: MISSED.</text><line x1="930" y1="690" x2="930" y2="770" stroke="#241F1B" stroke-width="2" /><polygon points="930.0,770.0 926.5,761.7 933.5,761.7" fill="#241F1B"/><line x1="170" y1="730" x2="170" y2="770" stroke="#B4412D" stroke-width="2" /><polygon points="170.0,770.0 166.5,761.7 173.5,761.7" fill="#B4412D"/><rect x="40" y="770" width="1040" height="80" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="560.0" y="794" font-size="15.5" font-weight="700" fill="#241F1B" text-anchor="middle" >Next case</text><text x="560.0" y="814" font-size="13" font-weight="400" fill="#675F55" text-anchor="middle" >Missed or solved, the day always continues. After case 10: the Daily Trail and the World Reveal.</text><rect x="1160" y="100" width="310" height="750" fill="#FBF7EF" stroke="#241F1B" stroke-width="1.6" /><text x="1315" y="138" font-size="20" font-weight="700" fill="#241F1B" text-anchor="middle" >The daily bank</text><text x="1180" y="178" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >8 Insight for all ten cases.</text><text x="1180" y="202" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >Never negative. Never refilled.</text><text x="1180" y="226" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >Spent only by Evidence (and</text><text x="1180" y="250" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >Trace, if kept), never by</text><text x="1180" y="274" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >navigation, Lock or rereading.</text><text x="1180" y="298" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" ></text><text x="1180" y="322" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >One bank, ten independent cases:</text><text x="1180" y="346" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >a miss in case 3 changes nothing</text><text x="1180" y="370" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >about case 4 except what you</text><text x="1180" y="394" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >chose to spend.</text><text x="1180" y="418" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" ></text><text x="1180" y="442" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >Refused actions are atomic:</text><text x="1180" y="466" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >no charge, no partial change.</text><text x="1180" y="490" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" ></text><text x="1180" y="514" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >Saved after every action.</text><text x="1180" y="538" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >Resuming restores the bank, every</text><text x="1180" y="562" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >candidate set and every purchase.</text><text x="1180" y="586" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" ></text><text x="1180" y="610" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >No double purchase.</text><text x="1180" y="634" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >A clue already revealed is</text><text x="1180" y="658" font-size="14" font-weight="400" fill="#241F1B" text-anchor="start" >refused, not charged twice.</text></svg></body></html>
